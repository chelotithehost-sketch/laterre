server_tools:
  rdns:
    name: Reverse DNS (PTR)
    how: socket.gethostbyaddr / DoH PTR
    guard: valid public IP only; private/reserved ranges refused
  tls_cert:
    name: TLS certificate probe
    how: ssl.create_default_context + socket on port 443
    guard: SSRF guard; port 443 only; 5 s timeout
  headers_probe:
    name: HTTP header probe
    how: requests.head/get allow_redirects, stream=True, no body read
    guard: SSRF guard re-checked after every redirect; http/https only; max 5 redirects
  email_dns:
    name: Email DNS health (SPF/DMARC/DKIM/MTA-STS)
    how: pure DNS via DoH results — no mail is ever sent
    guard: DNS lookups only
